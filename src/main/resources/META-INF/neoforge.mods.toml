modLoader = "javafml"
loaderVersion = "[0,)"
license = "MIT"
issueTrackerURL = "https://github.com/iA7MD-7/AE2-RS2-Pattern-Converter-FB-Bug-Reports/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}

Drop encoded patterns from Refined Storage 2 or Applied Energistics 2 into the Pattern Converter with a stack of the other mod's blank patterns and it re-encodes them through each mod's own pattern API: crafting, processing, stonecutter and smithing patterns all round-trip. Direction is detected automatically and can be locked. Addon-aware (AdvancedAE, Expanded AE, ExtendedAE, Refined Types, Applied Flux, Ars Energistique) and config-driven for pack developers.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[26.1.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[26.1.2]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "refinedstorage"
type = "required"
versionRange = "[${rs2_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "[${ae2_version},)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
