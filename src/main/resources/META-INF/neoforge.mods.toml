type = "optional"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "refinedtypes"
type = "optional"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "appflux"
type = "optional"
ordering = "AFTER"
side = "BOTH"

[[dependencies.${mod_id}]]
